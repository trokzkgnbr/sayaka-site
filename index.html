<!DOCTYPE html>
<html lang="ja">
<head>

  <title>SAYAYOSUI｜home</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css?v=57">
</head>
<body class="page-home page-has-bg" data-page="home">
  <header class="site-header site-header--overlay" id="site-header">
    <nav class="site-nav" id="site-nav" aria-label="メインメニュー"></nav>
    <div class="site-sns" id="site-sns" aria-label="SNS"></div>
  </header>

  <div class="home-stage">
    <div class="home-fold">
      <div class="home-artwork">
        <div class="home-visual">
          <img
            class="site-bg__img"
            id="home-visual"
            src="images/home/main-visual.jpg?v=43"
            alt=""
            width="2400"
            height="1607"
            fetchpriority="high"
          >
        </div>

        <section class="home-caption home-caption--fold" aria-labelledby="home-caption-heading">
          <h2 class="visually-hidden" id="home-caption-heading">作品情報</h2>
          <div class="home-caption__body" id="home-caption-fold">
            <div class="home-caption__group">
              <span class="home-caption__line home-caption__year">2022</span>
              <span class="home-caption__line home-caption__title">今日からあなたは私だけの夢を見る</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <section class="home-caption home-caption--rest">
      <div class="home-caption__body" id="home-caption-rest">
        <div class="home-caption__group">
          <span class="home-caption__line home-caption__meta">oil on canvas</span>
          <span class="home-caption__line home-caption__meta">1303 × 1940mm</span>
        </div>
        <div class="home-caption__group">
          <span class="home-caption__line home-caption__poem">美しくて醜い魂が零れる滴のように</span>
          <span class="home-caption__line home-caption__poem">いつしか蝶と呼ばれて</span>
          <span class="home-caption__line home-caption__poem">天に還る</span>
        </div>
      </div>
    </section>
  </div>

  <footer class="site-footer site-footer--glass">
    <p><small>&copy; <span id="year"></span> <span id="footer-name">SAYA YOSUI</span></small></p>
  </footer>
