# Instagram → Blog データ自動同期 + 変更時のみ GitHub Pages 公開
# 必要: Secrets … INSTAGRAM_ACCESS_TOKEN, INSTAGRAM_USER_ID
# 推奨: INSTAGRAM_APP_ID, INSTAGRAM_APP_SECRET, INSTAGRAM_USER_ACCESS_TOKEN
#
# Actions の push は別ワークフローを起動しないため、同期後の公開は本ファイル内の deploy ジョブで行う。
name: Sync Instagram Diary

on:
  schedule:
    # cron は UTC。GitHub は毎時 :00 付近で schedule が遅延・欠落しやすいため、
    # 複数スロット + :05/:17/:35 に分散する（JST = UTC+9）。
    # お昼帯: 12:05 / 12:17 / 12:35 / 13:05 JST
    - cron: "5 3 * * *"
    - cron: "17 3 * * *"
    - cron: "35 3 * * *"
    - cron: "5 4 * * *"
    # 深夜帯: 24:05 / 24:17 / 24:35 / 25:05 JST（翌1:05）
    - cron: "5 15 * * *"
    - cron: "17 15 * * *"
    - cron: "35 15 * * *"
    - cron: "5 16 * * *"
  workflow_dispatch:

concurrency:
  group: sync-instagram-diary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      diary_changed: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if recently synced (schedule only)
        id: recent
        run: python3 scripts/should_skip_instagram_sync.py

      - name: Skipped (recent sync)
        if: steps.recent.outputs.skip == 'true'
        run: echo "直近 90 分以内に同期済みのためスキップしました。"

      - name: Set up Python
        if: steps.recent.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.recent.outputs.skip != 'true'
        run: pip install -r scripts/requirements-instagram-sync.txt

      - name: Test diary merge and deletion rules
        if: steps.recent.outputs.skip != 'true'
        run: python3 scripts/test_sync_instagram_diary.py

      - name: Extend Instagram token if needed
        if: steps.recent.outputs.skip != 'true'
        id: extend_token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: |
          echo "extended=false" >> "$GITHUB_OUTPUT"
          if [[ -z "${INSTAGRAM_APP_ID}" || -z "${INSTAGRAM_APP_SECRET}" ]]; then
            echo "延長スキップ: INSTAGRAM_APP_ID / INSTAGRAM_APP_SECRET が未設定"
            exit 0
          fi
          set +e
          OUTPUT=$(python3 scripts/extend_instagram_token.py --if-needed --export-env 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q '^INSTAGRAM_ACCESS_TOKEN='; then
            NEW_TOKEN=$(echo "$OUTPUT" | grep '^INSTAGRAM_ACCESS_TOKEN=' | tail -1 | cut -d= -f2-)
            echo "extended=true" >> "$GITHUB_OUTPUT"
            {
              echo "value<<TOKEN_EOF"
              echo "$NEW_TOKEN"
              echo "TOKEN_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::トークンを延長しました。Secrets の INSTAGRAM_ACCESS_TOKEN をログの新トークンに更新してください。"
          fi

      - name: Resolve Instagram token for sync
        if: steps.recent.outputs.skip != 'true'
        id: instagram_token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ steps.extend_token.outputs.extended == 'true' && steps.extend_token.outputs.value || secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_USER_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: python3 scripts/ci_resolve_instagram_token.py

      - name: Sync diary from Instagram
        if: steps.recent.outputs.skip != 'true'
        id: sync
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ steps.instagram_token.outputs.value }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_SYNC_LIMIT: ${{ vars.INSTAGRAM_SYNC_LIMIT || '50' }}
        run: |
          set -euo pipefail
          python3 scripts/sync_instagram_diary.py | tee sync.log
          python3 scripts/verify_diary_after_sync.py
          POSTS=$(python3 -c "import json; d=json.load(open('data/diary.json')); print(len(d.get('posts',[])))")
          echo "post_count=$POSTS" >> "$GITHUB_OUTPUT"
          echo "Blog 投稿数: $POSTS"

      - name: Commit and push if changed
        if: steps.recent.outputs.skip != 'true'
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(blog): sync from Instagram (${{ steps.sync.outputs.post_count }} posts)"
          file_pattern: "data/diary.json images/diary/*.jpg"

      - name: Sync produced no data (fail)
        if: steps.recent.outputs.skip != 'true' && steps.sync.outputs.post_count == '0'
        run: |
          echo "::error::Instagram 同期後の投稿が 0 件です。トークン・@4mnion の投稿を確認してください。"
          exit 1

  deploy:
    needs: sync
    if: needs.sync.outputs.diary_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      # sync ジョブのコミット後の main 先端を取る（既定 checkout はワークフロー開始時の SHA）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assemble public site
        run: bash scripts/prepare-pages-site.sh _site

      - name: Publish to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          single-commit: true
          clean: true
