# 静的サイトを gh-pages ブランチに公開（Settings → Pages で branch: gh-pages を指定）
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "data/**"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/prepare-pages-site.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site
        run: bash scripts/prepare-pages-site.sh _site

      - name: Publish to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          single-commit: true
          clean: true
