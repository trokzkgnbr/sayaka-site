# 静的サイトを gh-pages ブランチへ公開（Settings → Pages: gh-pages / root）
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "data/**"
      - "config/blog-admin-path.txt"
      - "admin/**"
      - ".nojekyll"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/prepare-pages-site.sh"
      - "scripts/check-pages-deploy-needed.sh"
  schedule:
    # 09:00 / 21:00 JST（UTC 0:00 / 12:00）
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Assemble public site
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: bash scripts/prepare-pages-site.sh _site

      - name: Checkout gh-pages
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh-pages-live
        continue-on-error: true

      - name: Check for changes (scheduled)
        if: github.event_name == 'schedule'
        id: check
        run: |
          set +e
          bash scripts/check-pages-deploy-needed.sh _site _gh-pages-live
          code=$?
          set -e
          if [[ "$code" -eq 1 ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to gh-pages branch
        if: github.event_name != 'schedule' || steps.check.outputs.deploy == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          single-commit: true
          clean: true

      - name: No changes
        if: github.event_name == 'schedule' && steps.check.outputs.deploy == 'false'
        run: echo "変更なしのためデプロイをスキップしました"
