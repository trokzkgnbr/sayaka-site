# 静的サイトを gh-pages ブランチへ公開（Settings → Pages: gh-pages / root）
# 公式 Actions デプロイへ移行する場合は Settings で Source を GitHub Actions に変更し、
# 本ファイルを configure-pages + deploy-pages 方式に差し替える（docs/GITHUB_PAGES_SETUP.md）
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "data/**"
      - ".nojekyll"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/prepare-pages-site.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site
        run: bash scripts/prepare-pages-site.sh _site

      - name: Publish to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          single-commit: true
          clean: true
