<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>Blog 管理 — 初回セットアップ</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <a class="admin-brand" href="./" aria-label="SAYAYOSUI">
        <img class="admin-brand__img" src="/images/logo.png?v=61" alt="Saya Yosui" width="1024" height="187">
      </a>
    </header>
    <h1 class="admin-title">Blog 管理 — 初回セットアップ</h1>

    <div class="admin-card">
      <p id="message" class="admin-message" hidden></p>
      <p>Blog 更新用のパスワードを決めてください（8文字以上）。<br>GitHub や公開サイトには保存されません。</p>
      <p class="admin-hint admin-hint--desktop">先にターミナルで <code>bash scripts/run_diary_admin.sh</code> を実行し、このページを <strong>http://127.0.0.1:8765/admin/setup.html</strong> で開いてください。</p>
      <form id="setup-form">
        <div class="admin-field">
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="new-password" enterkeyhint="next" minlength="8" required>
        </div>
        <div class="admin-field">
          <label for="password2">パスワード（確認）</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" enterkeyhint="done" minlength="8" required>
        </div>
        <div class="admin-actions admin-actions--sticky">
          <button class="admin-btn" type="submit">保存してログインへ</button>
        </div>
      </form>
    </div>
  </div>
  <script src="auth-config.js"></script>
  <script src="js/auth-gate.js"></script>
  <script src="js/admin.js"></script>
  <script>
    (function () {
      const form = DiaryAdmin.qs("#setup-form");
      const message = DiaryAdmin.qs("#message");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        DiaryAdmin.showMessage(message, "", "error");
        const password = DiaryAdmin.qs("#password").value;
        const password2 = DiaryAdmin.qs("#password2").value;
        if (password !== password2) {
          DiaryAdmin.showMessage(message, "パスワードが一致しません", "error");
          return;
        }
        try {
          await DiaryAdmin.api("api/setup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: password, confirm: password2 }),
          });
          window.location.href = "login.html";
        } catch (err) {
          DiaryAdmin.showMessage(message, err.message, "error");
        }
      });

      DiaryAdmin.api("api/session")
        .then(function (session) {
          if (!session.setupRequired) {
            window.location.href = "login.html";
          }
        })
        .catch(function () {
          DiaryAdmin.showMessage(
            message,
            "管理サーバーに接続できません。ターミナルで bash scripts/run_diary_admin.sh を実行してください。",
            "error"
          );
        });
    })();
  </script>
</body>
</html>
