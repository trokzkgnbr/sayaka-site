<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gallery">
  <title>SAYAYOSUI｜gallery</title>
  <script>
    (function () {
      try {
        var w = sessionStorage.getItem('galleryReferenceDisplayW');
        if (w) {
          document.documentElement.style.setProperty('--gallery-image-display-w', w + 'px');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css?v=42">
</head>
<body class="page-inner" data-page="gallery">
  <header class="site-header site-header--overlay" id="site-header">
    <nav class="site-nav" id="site-nav" aria-label="メインメニュー"></nav>
    <div class="site-sns" id="site-sns" aria-label="SNS"></div>
  </header>

  <main class="page-main page-main--gallery">
    <div class="gallery-layout">
      <nav class="gallery-category-nav" aria-label="Gallery categories">
        <ul class="gallery-category-nav__list" id="gallery-category-nav"></ul>
      </nav>
      <h1 class="visually-hidden" id="gallery-page-title">Gallery</h1>
      <div class="gallery" id="gallery" role="list"></div>
    </div>
  </main>

  <footer class="site-footer site-footer--glass">
    <p><small>&copy; <span id="year"></span> <span id="footer-name">SAYA YOSUI</span></small></p>
  </footer>

  <script src="js/site-config.js"></script>
  <script src="js/artwork-size.js?v=42"></script>
  <script src="js/nav.js?v=42"></script>
  <script src="js/sns.js?v=42"></script>
  <script src="js/main.js?v=42"></script>
  <script src="js/gallery.js?v=42"></script>
</body>
</html>
